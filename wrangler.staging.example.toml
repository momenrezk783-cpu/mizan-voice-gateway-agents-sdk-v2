# COPY to wrangler.staging.toml (gitignored) only after provisioning separate resources.
# This template MUST NOT be used to deploy. No production domain routes are declared.
name = "mizan-voice-gateway-staging"
main = "src/index.ts"
compatibility_date = "2026-11-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
ENVIRONMENT = "staging"
MIZAN_VOICE_ID = "2DkHmQavK9V2UzTYrMYT"
VOICE_WS_BASE = "wss://REPLACE_WITH_STAGING_WORKERS_DEV_HOST"
PRIMARY_LLM = "@cf/daily-co/phonellm-mini-alpha-2"
FALLBACK_LLM = "@cf/deepseek-ai/deepseek-v4.1-flash-1017"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "mizan-portal-db-staging"
database_id = "REPLACE_WITH_STAGING_D1_UUID"

[[kv_namespaces]]
binding = "TENANT_CONFIG"
id = "REPLACE_WITH_STAGING_KV_ID"

[[durable_objects.bindings]]
name = "MIZAN_VOICE_AGENT"
class_name = "MizanVoiceAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MizanVoiceAgent"]

[[queues.producers]]
binding = "BACKGROUND_QUEUE"
queue = "mizan-background-staging"

[[queues.consumers]]
queue = "mizan-background-staging"
max_batch_size = 10
max_batch_timeout = 5

[[analytics_engine_datasets]]
binding = "VOICE_METRICS"
dataset = "mizan_voice_latency_staging"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/c/*", "/api/*", "/agents/*", "/embed/*", "/pcm-processor.js"]

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true
head_sampling_rate = 1
