name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run automated release gate
        run: npm run release:gate
      - name: Install Chromium for browser acceptance tests
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance tests (mocked providers)
        run: npm run test:browser

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: Release production Worker
    # Configure required reviewers and main-only branches in repository Settings.
    environment: production
    concurrency:
      group: mizan-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify private-contact schema exists (read only)
        run: >-
          npx wrangler d1 execute mizan-portal-db --remote
          --command "SELECT tenant_slug, session_id, details_enc, updated_at FROM call_contact_details LIMIT 0; SELECT id, request_key, details_enc, status, created_at, updated_at FROM quote_requests LIMIT 0; SELECT rate_key, hits, reset_at, last_request FROM quote_intake_limits LIMIT 0;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
