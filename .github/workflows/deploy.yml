name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:
    inputs:
      diagnostics_only:
        description: 'Inspect runtime settings/errors and probe AI with synthetic text; do not deploy'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Validate & Deploy Worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript validation
        run: npm run typecheck

      - name: Regression tests
        run: npm test

      - name: Isolated local bundle validation
        run: npm run bundle:check

      - name: Diagnose Workers AI without deployment
        if: inputs.diagnostics_only == true
        run: node scripts/diagnose-workers-ai.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Probe AI binding in isolated remote preview
        if: inputs.diagnostics_only == true
        run: node scripts/probe-ai-binding.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers (main branch only)
        if: github.ref == 'refs/heads/main' && inputs.diagnostics_only != true
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
