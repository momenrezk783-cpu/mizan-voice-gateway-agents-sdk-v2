name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run automated release gate
        run: npm run release:gate
      - name: Install Chromium for browser acceptance tests
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance tests (mocked providers)
        run: npm run test:browser

  deploy-studio-dev:
    needs: validate
    if: (github.ref == 'refs/heads/work/voice-studio-pipeline' || github.event_name == 'workflow_dispatch') && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: Deploy isolated Studio Dev Worker
    environment: studio-dev
    concurrency:
      group: mizan-studio-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate isolated Studio Dev config
        run: node scripts/check-staging-config.mjs wrangler.studio-dev.toml
      - name: Apply additive migration-008 and seed dev D1
        run: >-
          npx wrangler d1 execute mizan-studio-db-dev --remote --config wrangler.studio-dev.toml --file=./migration-008.sql &&
          npx wrangler d1 execute mizan-studio-db-dev --remote --config wrangler.studio-dev.toml --file=./scripts/seed-studio-dev.sql
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy mizan-voice-studio-dev
        run: npx wrangler deploy --config wrangler.studio-dev.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Run post-deploy Studio smoke check
        if: env.STUDIO_BASE_URL != '' && env.STUDIO_API_TOKEN != ''
        run: node scripts/smoke-studio.mjs
        env:
          STUDIO_BASE_URL: ${{ vars.STUDIO_BASE_URL }}
          STUDIO_API_TOKEN: ${{ secrets.STUDIO_API_TOKEN }}

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: Release production Worker
    # Configure required reviewers and main-only branches in repository Settings.
    environment: production
    concurrency:
      group: mizan-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Verify private-contact and release-versioning schema exists (read only)
        run: >-
          npx wrangler d1 execute mizan-portal-db --remote
          --command "SELECT tenant_slug, session_id, details_enc, updated_at FROM call_contact_details LIMIT 0; SELECT id, request_key, details_enc, status, created_at, updated_at FROM quote_requests LIMIT 0; SELECT rate_key, hits, reset_at, last_request FROM quote_intake_limits LIMIT 0; SELECT session_id,tenant_slug,revision FROM call_operations LIMIT 0; SELECT session_id,started_at,admitted_at FROM usage_reservations LIMIT 0; SELECT tenant_slug,monthly_seconds,max_call_seconds FROM tenant_billing LIMIT 0; SELECT tenant_slug FROM weekly_reports LIMIT 0; SELECT tenant_slug FROM calendar_integrations LIMIT 0; SELECT tenant_slug FROM booking_operations LIMIT 0; SELECT tenant_slug FROM knowledge_versions LIMIT 0; SELECT tenant_slug FROM knowledge_gaps LIMIT 0; SELECT tenant_slug, version_number, bundle_hash FROM agent_config_versions LIMIT 0; SELECT tenant_slug, version_number FROM agent_active_version LIMIT 0; SELECT trace_id, tenant_slug, config_version FROM turn_traces LIMIT 0;"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
