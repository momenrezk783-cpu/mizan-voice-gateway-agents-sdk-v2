<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#06060a">
  <title>ميزان كونسلت — مساعد صوتي للعيادات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Tajawal', system-ui, sans-serif;
      background: #06060a;
      color: #f8fafc;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow: hidden;
      position: relative;
    }
    .aurora { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .aurora-blob { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.5; animation: float 18s ease-in-out infinite; }
    .aurora-blob:nth-child(1) { width: 480px; height: 480px; background: #6366f1; top: -10%; right: -5%; }
    .aurora-blob:nth-child(2) { width: 400px; height: 400px; background: #ec4899; bottom: -10%; left: -5%; animation-delay: -6s; }
    .aurora-blob:nth-child(3) { width: 300px; height: 300px; background: #0ea5e9; top: 40%; left: 50%; opacity: 0.3; animation-delay: -12s; }
    @keyframes float { 0%,100%{transform:translate(0,0) scale(1)} 33%{transform:translate(40px,-50px) scale(1.1)} 66%{transform:translate(-30px,40px) scale(0.95)} }

    .card {
      position: relative; z-index: 1;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(24px) saturate(1.5);
      -webkit-backdrop-filter: blur(24px) saturate(1.5);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 28px;
      width: 100%; max-width: 480px;
      padding: 3rem 2rem;
      display: flex; flex-direction: column; align-items: center; gap: 1.5rem;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.05), 0 20px 60px rgba(0,0,0,0.5), 0 0 100px rgba(99,102,241,0.4);
    }
    .logo { font-size: 2rem; font-weight: 700; letter-spacing: -0.02em; background: linear-gradient(135deg, #f8fafc, rgba(248,250,252,0.55)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .tagline { font-size: 0.875rem; color: rgba(248,250,252,0.55); text-align: center; }
    .features { display: flex; flex-direction: column; gap: 0.75rem; width: 100%; margin-top: 0.5rem; }
    .feature { display: flex; align-items: center; gap: 0.75rem; padding: 0.875rem 1rem; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; font-size: 0.875rem; }
    .feature svg { width: 20px; height: 20px; color: #818cf8; flex-shrink: 0; }
    .footer { font-size: 0.75rem; color: rgba(248,250,252,0.35); margin-top: 0.5rem; }
    .footer a { color: #818cf8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="aurora"><div class="aurora-blob"></div><div class="aurora-blob"></div><div class="aurora-blob"></div></div>
  <div class="card">
    <div class="logo">ميزان كونسلت</div>
    <div class="tagline">مساعد صوتي ذكي للعيادات والعيادات التخصصية</div>
    <div class="features">
      <div class="feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        حجز المواعيد بالصوت باللهجة المصرية
      </div>
      <div class="feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg>
        الرد على استفسارات المرضى على مدار الساعة
      </div>
      <div class="feature">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        حماية بيانات المرضى وفقاً لقانون ١٥١ لسنة ٢٠٢٠
      </div>
    </div>
    <div class="footer">مدعوم بواسطة <a href="https://mizanconsult.com">ميزان كونسلت</a></div>
  </div>
</body>
</html>
