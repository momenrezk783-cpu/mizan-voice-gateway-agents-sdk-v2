<style>html{scroll-behavior:smooth}body{background:#ede8de;color:#161410;font-family:"IBM Plex Sans Arabic","DM Sans",sans-serif}.hero-rules{background-image:linear-gradient(to right,rgba(247,244,236,.07) 1px,transparent 1px);background-size:5.5rem 100%;opacity:.4}.wave-bar{width:3px;border-radius:99px;background:rgba(200,163,106,.85);transform-origin:bottom;animation:wave-pulse 1.1s ease-in-out infinite}@keyframes wave-pulse{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}.hero.navy{background:linear-gradient(180deg,#122A4A,#0A1628);color:#EAF0F8;border-radius:20px;box-shadow:0 24px 60px rgba(7,17,26,.38)}.hero.navy p{color:#B9C6DA}.hero.navy em{color:#c8a36a}

/* ── Mobile / phone-friendly UI improvements ── */
*, button, a, [role="button"], input, textarea, select{ -webkit-tap-highlight-color: transparent; }
button, a, [role="button"], input, textarea, select{ touch-action: manipulation; }

/* Minimum touch target 44px for all interactive elements on phones */
@media (max-width: 640px){
  button, a, [role="button"]{ min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center; }
  /* Make primary CTAs full width on small screens */
  .mobile-full{ width: 100%; }
  /* Give page bottom padding so sticky nav doesn't cover content */
  #html-root{ padding-bottom: 86px; }
  /* Live call modal: tighter on phones */
  .fixed.inset-0.z-50 > div{ max-w-xs !important; p-4 !important; }
  .wave-bar{ width: 2.5px; }
  /* Form labels/inputs full width */
  form > div.grid{ grid-template-columns: 1fr !important; }
  /* Hero: stack buttons vertically */
  .hero-cta-mobile{ flex-direction: column !important; gap: 0.75rem !important; width: 100% !important; }
  .hero-cta-mobile > button, .hero-cta-mobile > a{ width: 100% !important; justify-content: center !important; }
  /* Section headings smaller on phones */
  h2{ font-size: 1.75rem !important; line-height: 1.2 !important; }
  p.text-base{ font-size: 0.95rem !important; line-height: 1.5 !important; }
}

/* Notched phone safe areas */
@supports (padding: max(0px)){
  #html-root{ padding-bottom: max(86px, env(safe-area-inset-bottom)); }
}

/* Smooth scroll only on non-touch or fine pointers */
@media (pointer: fine){ html{ scroll-behavior: smooth; } }

/* ── Voice Call Mini-Window ── */
.voice-mini-window{position:relative;margin:1rem auto 1.25rem;width:min(420px,92vw);background:#0c1a28;border:1px solid #c8a36a/20;border-radius:20px;box-shadow:0 25px 50px -12px rgba(7,17,26,0.5);z-index:10;display:flex;flex-direction:column;overflow:hidden}
.voice-mini-window.hidden{display:none}
.voice-mini-header{padding:1rem;border-bottom:1px solid #c8a36a/15;display:flex;justify-content:space-between;align-items:center}
.voice-mini-title{font-size:0.95rem;font-weight:800;color:#f7f4ec}
.voice-mini-status{font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;padding:0.25rem 0.6rem;border-radius:999px;border:1px solid #34d399/40;background:#34d399/10;color:#86efac}
.voice-mini-status.disconnected{border-color:#f87171/40;background:#f87171/10;color:#fca5a5}
.voice-mini-status.connecting{border-color:#fbbf24/40;background:#fbbf24/10;color:#fde047}
.voice-mini-body{padding:1rem}
.voice-mini-indicator{display:flex;align-items:center;gap:0.75rem;margin-bottom:1rem}
.voice-mini-dot{width:10px;height:10px;border-radius:50%;background:#f87171}
.voice-mini-dot.listening{background:#34d399}
.voice-mini-dot.speaking{background:#c8a36a}.voice-mini-dot.muted{background:#fbbf24}
.voice-mini-mode{font-size:0.75rem;font-weight:700}
.voice-mini-timer{font-family:"DM Sans",sans-serif;font-size:1.5rem;font-weight:800;text-align:center;margin-bottom:0.75rem}
.voice-mini-progress{height:4px;background:#c8a36a/10;border-radius:2px;overflow:hidden;margin-bottom:1rem}
.voice-mini-progress-fill{height:100%;background:#c8a36a;width:100%;transition:width 0.1s linear}
.voice-mini-transcript{max-height:120px;overflow-y:auto;font-size:0.8rem;line-height:1.5;color:#c8a36a/80}
.voice-mini-transcript-msg{margin-bottom:0.5rem;padding:0.5rem;border-radius:8px;display:inline-block}
.voice-mini-transcript-msg.user{background:#c8a36a/15;border-left:3px solid #c8a36a;color:#f7f4ec}
.voice-mini-transcript-msg.agent{background:#34d399/15;border-left:3px solid #34d399;color:#86efac}
.voice-mini-transcript-label{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;margin-bottom:0.15rem;color:#c8a36a/50}
.voice-mini-controls{display:flex;gap:0.75rem;margin-top:1rem}
.voice-mini-btn{flex:1;border:none;border-radius:12px;padding:0.75rem;font-size:0.85rem;font-weight:700;cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:0.5rem}
.voice-mini-btn.primary{background:#c8a36a;color:#07111a}
.voice-mini-btn.primary:hover{background:#e5d8be}
.voice-mini-btn.end{background:#f87171;color:#f7f4ec}
.voice-mini-btn.end:hover{background:#fb7185}
.voice-mini-btn.mute{background:#c8a36a/20;border:1px solid #c8a36a/40;color:#c8a36a}
.voice-mini-btn.mute.muted{background:#f87171/20;border-color:#f87171/40;color:#fca5a5}
.voice-mini-btn.hidden{display:none}
.voice-mini-error{background:#f87171/20;border:1px solid #f87171/40;color:#fca5a5;padding:0.5rem;border-radius:8px;font-size:0.75rem;margin-bottom:0.75rem;text-align:center}
.voice-mini-error.hidden{display:none}
@media (max-width: 640px){
  .voice-mini-window{width:92vw}
}

<div class="rounded-xl border border-[#e0d9ce] bg-[#f8f5ed] overflow-hidden"><div class="flex flex-wrap items-center justify-between gap-2 border-b border-[#e5ded3] px-5 py-4"><div><h2 class="font-semibold">طابور المراجعة وسجلات المكالمات</h2></div><div class="flex flex-wrap items-center gap-2"><input value="${STATE.searchQ||""}" onchange="STATE.searchQ=this.value;loadPortalData();" placeholder="بحث في السجلات..." class="h-8 rounded border border-[#d6cec1] bg-white px-2.5 text-xs"/><select onchange="STATE.filterStatus=this.value;loadPortalData();" class="h-8 rounded border border-[#d6cec1] bg-white px-2 text-xs"><option value="all" ${STATE.filterStatus==="all"?"selected":""}>الكل</option><option value="open" ${STATE.filterStatus==="open"?"selected":""}>مفتوح</option><option value="responded" ${STATE.filterStatus==="responded"?"selected":""}>تم الرد</option><option value="closed" ${STATE.filterStatus==="closed"?"selected":""}>مغلق</option></select><button onclick="exportQueriesCSV()" class="rounded border border-[#082840] px-2.5 py-1.5 text-xs font-semibold text-[#082840]">📥 تصدير CSV</button></div></div><div class="divide-y divide-[#e9e3d8]">${STATE.queries.length===0?`<div class="p-8 text-center text-xs text-[#777166]">لا توجد سجلات مطابقة.</div>`:STATE.queries.map(q=>`<div class="p-4 hover:bg-[#f3f0e9]"><div><span class="font-semibold text-sm text-[#082840]">${q.subject}</span> <span class="rounded-full px-2 py-0.5 text-[10px] font-semibold ${q.status==="open"?"bg-[#f3e9ce] text-[#735b22]":q.status==="closed"?"bg-[#e8e5df] text-[#666159]":"bg-[#dfebe4] text-[#28594c]"}">${q.status}</span> <button onclick="updateQueryStatus('${q.id}','${q.status==="open"?"responded":q.status==="responded"?"closed":"open"}')" class="mr-2 rounded border border-[#d6cec1] bg-white px-2 py-0.5 text-[10px] font-semibold text-[#082840]">${q.status==="open"?"✓ تعليم كمجاب":q.status==="responded"?"🔒 إغلاق":"↺ إعادة فتح"}</button><p class="mt-1 text-xs text-[#777166]">${q.client_name} · ${new Date(q.created_at).toLocaleString("ar-EG")}</p><p class="mt-2 whitespace-pre-wrap text-xs leading-6 text-[#4d4b45]">${q.message}</p></div></div>`).join("")}</div></div></div>`;}
function toggleVoiceMini(){STATE.voiceMiniOpen=!STATE.voiceMiniOpen;if(!STATE.voiceMiniOpen){endVoiceMiniCall();}else{startVoiceMiniCall();}render();if(STATE.voiceMiniOpen){setTimeout(()=>{document.getElementById('voice-mini-window')?.scrollIntoView({behavior:'smooth',block:'center'});},80);}}

function startVoiceMiniCall(){if(STATE.voiceMiniWs){return;}try{const AC=window.AudioContext||window.webkitAudioContext;if(!STATE.voiceMiniAudioCtx&&AC){STATE.voiceMiniAudioCtx=new AC();}if(STATE.voiceMiniAudioCtx&&STATE.voiceMiniAudioCtx.state==='suspended'){STATE.voiceMiniAudioCtx.resume();}}catch(e){}STATE.voiceMiniError=null;STATE.voiceMiniCursor=0;STATE.voiceMiniSeconds=120;STATE.voiceMiniSpeaking=false;STATE.voiceMiniListening=false;STATE.voiceMiniMuted=true;render();const ws=new WebSocket('wss://mizan-voice-agent.momenrezk783.workers.dev/agents/mizan-voice-agent/mizan-hq');STATE.voiceMiniWs=ws;ws.binaryType='arraybuffer';ws.onopen=()=>{ws.send(JSON.stringify({type:'start_call'}))};ws.onmessage=(event)=>{if(typeof event.data==='string'){const msg=JSON.parse(event.data);if(msg.type==='welcome'){STATE.voiceMiniListening=false;render();startVoiceMiniTimer();if(/android/i.test(navigator.userAgent)){startVoiceMiniSpeechRec(ws);}else{startVoiceMiniMic(ws);}}else if(msg.type==='status'){STATE.voiceMiniSpeaking=(msg.status==='speaking');if(msg.status==='listening'){if(!STATE.voiceMiniMuted){STATE.voiceMiniListening=true;}flushVoiceMiniSRBuffer(ws);}render();}else if(msg.type==='transcript'){const el=document.getElementById('voice-mini-transcript');if(el){const div=document.createElement('div');div.className='voice-mini-transcript-msg '+msg.role;div.innerHTML='<div class="voice-mini-transcript-label">'+(msg.role==='user'?'المتصل':'ميزان')+'</div><div>'+msg.text+'</div>';el.appendChild(div);el.scrollTop=el.scrollHeight;}}else if(msg.type==='error'){STATE.voiceMiniError=msg.message||'voice error';render();}}else{playVoiceMiniAudio(event.data)}};ws.onclose=()=>{endVoiceMiniCall();STATE.voiceMiniError='انقطع الاتصال';render();};ws.onerror=()=>{STATE.voiceMiniError='خطأ في الاتصال';render();}}

function endVoiceMiniCall(){if(STATE.voiceMiniTimer){clearInterval(STATE.voiceMiniTimer);STATE.voiceMiniTimer=null;}if(STATE.voiceMiniSpeechRec){try{STATE.voiceMiniSpeechRec.stop();}catch(_){}STATE.voiceMiniSpeechRec=null;}if(STATE.voiceMiniMediaRecorder){try{STATE.voiceMiniMediaRecorder.stop();}catch(_){}STATE.voiceMiniMediaRecorder=null;}if(STATE.voiceMiniMicStream){STATE.voiceMiniMicStream.getTracks().forEach(t=>t.stop());STATE.voiceMiniMicStream=null;}if(STATE.voiceMiniWs){try{STATE.voiceMiniWs.send(JSON.stringify({type:'end_call'}));}catch(_){}try{STATE.voiceMiniWs.close();}catch(_){}STATE.voiceMiniWs=null;}STATE.voiceMiniSpeaking=false;STATE.voiceMiniListening=false;STATE.voiceMiniMuted=false;STATE.voiceMiniSRBuffer='';STATE.voiceMiniSRLast='';if(STATE.voiceMiniSRTimer){clearTimeout(STATE.voiceMiniSRTimer);STATE.voiceMiniSRTimer=null;}STATE.voiceMiniSeconds=120;render();}

function toggleVoiceMiniMute(){STATE.voiceMiniMuted=!STATE.voiceMiniMuted;if(!STATE.voiceMiniMuted&&STATE.voiceMiniWs){if(/android/i.test(navigator.userAgent)){startVoiceMiniSpeechRec(STATE.voiceMiniWs);}else{startVoiceMiniMic(STATE.voiceMiniWs);}}STATE.voiceMiniListening=!STATE.voiceMiniMuted;render();}

function startVoiceMiniTimer(){if(STATE.voiceMiniTimer){clearInterval(STATE.voiceMiniTimer);}STATE.voiceMiniTimer=setInterval(()=>{STATE.voiceMiniSeconds--;if(STATE.voiceMiniSeconds<=0){endVoiceMiniCall();STATE.voiceMiniOpen=false;}render();},1000);}

async function startVoiceMiniMic(ws){try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});STATE.voiceMiniMicStream=stream;const ctx=STATE.voiceMiniAudioCtx||new AudioContext();STATE.voiceMiniAudioCtx=ctx;if(ctx.state==='suspended'){ctx.resume();}const source=ctx.createMediaStreamSource(stream);const workletScript=`class AudioCaptureProcessor extends AudioWorkletProcessor{constructor(){super();this.ratio=sampleRate/16000;}process(inputs){const ch=inputs[0][0];if(ch){const out=new Int16Array(Math.floor(ch.length/this.ratio));for(let i=0;i<out.length;i++){out[i]=ch[Math.floor(i*this.ratio)]*32767;}this.port.postMessage({audio:out});}return true;}}registerProcessor('audio-capture-processor',AudioCaptureProcessor);`;const blob=new Blob([workletScript],{type:'application/javascript'});const url=URL.createObjectURL(blob);await ctx.audioWorklet.addModule(url);URL.revokeObjectURL(url);const node=new AudioWorkletNode(ctx,'audio-capture-processor');source.connect(node);node.port.onmessage=(e)=>{if(!STATE.voiceMiniMuted&&ws.readyState===WebSocket.OPEN){ws.send(e.data.audio)}};if(STATE.voiceMiniMuted){try{source.disconnect();node.disconnect();}catch(_){}}}catch(e){STATE.voiceMiniError='Microphone access denied: '+(e.message||e||'unknown error');render();}}

async function playVoiceMiniAudio(data){if(typeof Blob!=='undefined'&&data instanceof Blob){data=await data.arrayBuffer();}const arrayBuffer=data;if(!STATE.voiceMiniAudioCtx){STATE.voiceMiniAudioCtx=new AudioContext();}const ctx=STATE.voiceMiniAudioCtx;if(ctx.state==='suspended'){ctx.resume();}try{const i16=new Int16Array(arrayBuffer);const buf=ctx.createBuffer(1,i16.length,24000);const ch=buf.getChannelData(0);for(let i=0;i<i16.length;i++)ch[i]=i16[i]/32768;const source=ctx.createBufferSource();source.buffer=buf;source.connect(ctx.destination);STATE.voiceMiniCursor=Math.max(ctx.currentTime,STATE.voiceMiniCursor||0);source.start(STATE.voiceMiniCursor);STATE.voiceMiniCursor+=buf.duration;}catch(e){console.error('voice mini audio pcm failed',e)}}

function flushVoiceMiniSRBuffer(ws){if(!STATE.voiceMiniOpen)return;const text=(STATE.voiceMiniSRBuffer||"").trim();if(!text)return;if(STATE.voiceMiniSpeaking||STATE.voiceMiniMuted)return;if(!ws||ws.readyState!==WebSocket.OPEN)return;STATE.voiceMiniSRBuffer="";if(STATE.voiceMiniSRTimer){clearTimeout(STATE.voiceMiniSRTimer);STATE.voiceMiniSRTimer=null;}ws.send(JSON.stringify({type:"text_message",text}));}
async function startVoiceMiniSpeechRec(ws){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){STATE.voiceMiniError='التعرف على الصوت غير مدعوم';render();return;}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});stream.getTracks().forEach(t=>t.stop());}catch(e){STATE.voiceMiniError='Microphone access denied: '+(e.message||e||'unknown error');render();return;}if(STATE.voiceMiniSpeechRec){try{STATE.voiceMiniSpeechRec.stop();}catch(_){}}const rec=new SR();rec.lang='ar-EG';rec.continuous=true;rec.interimResults=true;STATE.voiceMiniSpeechRec=rec;rec.onresult=(e)=>{if(!STATE.voiceMiniOpen||STATE.voiceMiniSpeaking||STATE.voiceMiniMuted)return;for(let i=e.resultIndex;i<e.results.length;i++){const res=e.results[i];const t=(res[0]?.transcript||'').trim();if(!t)continue;if(res.isFinal&&t.length>=2){if(t===STATE.voiceMiniSRLast)continue;STATE.voiceMiniSRLast=t;STATE.voiceMiniSRBuffer=STATE.voiceMiniSRBuffer?(STATE.voiceMiniSRBuffer+' '+t).trim():t;if(STATE.voiceMiniSRTimer)clearTimeout(STATE.voiceMiniSRTimer);STATE.voiceMiniSRTimer=setTimeout(()=>{STATE.voiceMiniSRTimer=null;flushVoiceMiniSRBuffer(ws);},900);}}};rec.onerror=(ev)=>{if(ev.error==='not-allowed'){STATE.voiceMiniError='Microphone access denied: microphone permission denied';render();return;}if(ev.error!=='aborted'&&STATE.voiceMiniOpen&&STATE.voiceMiniListening){setTimeout(()=>{if(STATE.voiceMiniOpen&&STATE.voiceMiniListening)startVoiceMiniSpeechRec(ws);},500)}};rec.onend=()=>{if(STATE.voiceMiniOpen&&STATE.voiceMiniListening){setTimeout(()=>{if(STATE.voiceMiniOpen&&STATE.voiceMiniListening)startVoiceMiniSpeechRec(ws);},500)}};setTimeout(()=>{try{rec.start()}catch(e){STATE.voiceMiniError='فشل بدء التعرف: '+(e.name||e.message);render()}},300)}



return `<div dir="rtl" class="flex min-h-screen bg-[#f1eee7] text-[#17232b]">${renderLiveCallModal()}<aside class="w-64 bg-[#082840] text-[#f7f4ec] flex flex-col justify-between p-4 shrink-0"><div><div class="flex items-center gap-3 pb-5 border-b border-white/10">${markSVG(38,"dark")}<div><strong class="block text-sm">لوحة تحكم المسؤول</strong><span class="block text-[10px] text-[#c8a36a]">${STATE.adminUser.name||STATE.adminUser.email}</span></div></div><nav class="mt-6 space-y-1">${nav.map(([h,l,ic])=>`<button onclick="navigate('${h}')" class="w-full flex items-center gap-2.5 rounded-md px-3 py-2.5 text-xs font-medium text-right ${STATE.view===h?"bg-white/15 text-white":"text-white/70 hover:bg-white/5"}"><span>${ic}</span><span>${l}</span></button>`).join("")}</nav></div><div class="border-t border-white/10 pt-4 space-y-2"><button onclick="navigate('landing')" class="w-full rounded border border-white/20 px-3 py-2 text-xs text-white/80 hover:bg-white/10">🌐 معاينة واجهة العميل</button><button onclick="handleAdminLogout()" class="w-full rounded bg-red-500/20 px-3 py-2 text-xs text-red-200 hover:bg-red-500/30">🚪 تسجيل الخروج</button></div></aside><div class="flex-1 p-6 sm:p-8 overflow-y-auto">${main}</div></div>`;}
async function updateQueryStatus(id,nextStatus){await authFetch("/api/queries/"+id+"/status",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status:nextStatus})});await loadPortalData();}
function exportQueriesCSV(){const NL=String.fromCharCode(10);const headers=["ID","Client","Subject","Status","Created_At","Message"];const rows=STATE.queries.map(q=>[q.id,q.client_name,q.subject,q.status,q.created_at,String(q.message||"").split(NL).join(" | ")].map(v=>`"${String(v||"").split('"').join('""')}"`).join(","));const csv=String.fromCharCode(0xFEFF)+[headers.join(","),...rows].join(NL);const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="mizan-queries-export.csv";a.click();}

async function saveKnowledge(e){e.preventDefault();const name=document.getElementById("kn-name").value;const system_extra=document.getElementById("kn-extra").value;const faq_text=document.getElementById("kn-faq").value;const r=await authFetch("/api/knowledge",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,system_extra,faq_text})});if(r.ok){STATE.knowledge={name,system_extra,faq_text};STATE.knowledgeSaved=true;render();}}
