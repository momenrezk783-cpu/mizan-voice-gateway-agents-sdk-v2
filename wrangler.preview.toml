# Isolated TTSForFree preview. Never use production routes, D1, KV or queues.
name = "mizan-tts-preview"
main = "src/index.ts"
compatibility_date = "2026-11-08"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
TTSFORFREE_VOICE_ID = "v1:v1kA8qJorar2kY8ZtfSi-hS5-wc83AjmckoSRP2qXX5cXsm1l0T-RZHpqLVp-HUMc58"
ENVIRONMENT = "staging"
MIZAN_VOICE_ID = "2DkHmQavK9V2UzTYrMYT"
VOICE_WS_BASE = "wss://mizan-tts-preview.momenrezk783.workers.dev"
PRIMARY_LLM = "@cf/daily-co/phonellm-mini-alpha-2"
FALLBACK_LLM = "@cf/deepseek-ai/deepseek-v4.1-flash-1017"

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "mizan-tts-preview-db"
database_id = "c273fa62-8cf9-4a57-86b6-da90213aa47e"

[[kv_namespaces]]
binding = "TENANT_CONFIG"
id = "c42a2668f40c4b4aab11423628cb09f9"

[[durable_objects.bindings]]
name = "MIZAN_VOICE_AGENT"
class_name = "MizanVoiceAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MizanVoiceAgent"]

[[queues.producers]]
binding = "BACKGROUND_QUEUE"
queue = "mizan-tts-preview-queue"

[[queues.consumers]]
queue = "mizan-tts-preview-queue"
max_batch_size = 10
max_batch_timeout = 5

[[analytics_engine_datasets]]
binding = "VOICE_METRICS"
dataset = "mizan_tts_preview_latency"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/", "/about", "/about.html", "/privacy", "/privacy.html", "/terms", "/terms.html", "/c/*", "/api/*", "/agents/*", "/embed/*", "/pcm-processor.js", "/tts-studio", "/tts-studio.html"]

[observability]
enabled = true
head_sampling_rate = 1
